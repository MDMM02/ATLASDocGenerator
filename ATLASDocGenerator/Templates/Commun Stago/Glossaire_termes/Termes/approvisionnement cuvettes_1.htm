            <p class="Glossary_term">approvisionnement cuvettes</p>
            <p>Les cuvettes sont chargées dans l'instrument au moyen de bobines de 1000 cuvettes.</p>
            <p>Les cuvettes sont distribuées une à une dans une navette positionnée à la station approvisionnement cuvettes. Cette navette est ensuite déplacée vers le poste de dépose échantillon.</p>
