        <div class="Glossary_entry">
            <p class="Glossary_term">diluant</p>
            <p>Voir Tampon Owren Koller (TOK)</p>
            <p class="Glossary_term">dilution</p>
            <p>Ajout d’un diluant dans un plasma pour obtenir une concentration inférieure de plasma ou d'un élément recherché dans le plasma.</p>
            <p>Ex : une solution de 1/20ème est constituée d’un volume de plasma et 19 volumes de diluant.</p>
