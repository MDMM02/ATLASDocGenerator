            <p class="Glossary_term">méthodologie</p>
            <p>Mode opératoire permettant d’effectuer une analyse. La méthodologie est décrite par un ensemble de tâches : pipetage, dilution, ajout de réactif, incubation, mesure.</p>
            <p>Ces tâches sont complétées par des tâches secondaires chargement cuvette, transferts, rinçages, …</p>
