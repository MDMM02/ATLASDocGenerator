            <p class="Glossary_term">détermination double</p>
            <p>La détermination d’un résultat peut être simple ou double.</p>
            <p>En détermination double, l'analyse est réalisée 2 fois, dans 2 cuvettes distinctes. En détermination simple, l'analyse est réalisée 1 seule fois (1 cuvette).</p>
