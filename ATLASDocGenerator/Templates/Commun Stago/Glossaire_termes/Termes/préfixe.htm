            <p class="Glossary_term">préfixe</p>
            <p>Un préfixe peut être utilisé pour différencier les populations d'échantillons suivant les critères choisis par le laboratoire.</p>
            <p>Ex. "POP" = préfixe pour préopératoire, "HEP" = préfixe pour malade sous Héparine.</p>
