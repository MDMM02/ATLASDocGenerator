            <p class="Glossary_term">relance</p>
            <p>La relance est le fait de réaliser la même mesure avec la même méthodologie, sur le même échantillon (patient, CQ ou calibrant), avec la même dilution qui vient d'amener à un résultat ou une erreur.</p>
