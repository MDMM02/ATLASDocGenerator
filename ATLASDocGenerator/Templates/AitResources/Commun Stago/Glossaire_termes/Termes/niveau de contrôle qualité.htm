            <p class="Glossary_term">niveau de contrôle (qualité)</p>
            <p>Utilisé lors des contrôles de qualité.</p>
            <p>Il peut y avoir jusqu’à trois niveaux de contrôle. Le niveau 1 représente généralement des échantillons de plasma normaux. Le niveau 2 représente des échantillons de plasma pathologiques.</p>
