        <div class="Glossary_entry">
            <p class="Glossary_term">barreau aimanté</p>
            <p>Les barreaux aimantés sont utilisés pour homogénéiser les réactifs.</p>
            <p>L'agitation est réalisée en plaçant un barreau aimanté dans le flacon de produit. Le barreau tourne sous l'effet de champs magnétiques d'aimants entraînés en rotation par un moteur.</p>
            <p>Voir aussi "Agitation".</p>
