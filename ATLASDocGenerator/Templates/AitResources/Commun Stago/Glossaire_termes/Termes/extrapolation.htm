        <div class="Glossary_entry">
            <p class="Glossary_term">extrapolation</p>
            <p>Estimation ou calcul d’une variable, en dehors de l’intervalle de variation des valeurs observées. L’extrapolation n’est possible que si elle est réalisée à partir d’un échantillon représentatif. Elle implique donc une régularité suffisante dans la suite des valeurs observées.</p>
