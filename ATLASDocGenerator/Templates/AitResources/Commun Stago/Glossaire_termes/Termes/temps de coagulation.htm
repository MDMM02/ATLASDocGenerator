            <p class="Glossary_term">temps de coagulation</p>
            <p>Voir "chronométrie".</p>
            <p class="Glossary_term">Temps de prothrombine (TP)</p>
            <p>Temps de coagulation du plasma recalcifié en présence d’un excès de thromboplastine tissulaire.</p>
            <p>Le temps de Prothrombine permet également l’exploration des voies extrinsèques de la coagulation (Facteurs II, V, VII et X).</p>
