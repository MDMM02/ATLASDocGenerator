            <p class="Glossary_term">rapport d'incident</p>
            <p>Un rapport d’incident est un dossier .zip généré automatiquement lors d’un incident ou à la demande. Le rapport d’incident regroupe des informations détaillées sur l’état du système au moment de sa génération.</p>
