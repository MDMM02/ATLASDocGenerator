            <p class="Glossary_term">cent pour cent (100%)</p>
            <p>Valeur de mesure brute pour laquelle la concentration est égale à 100%. Pour les méthodologies précalibrées, cette valeur est calculée par interpolation de la valeur de concentration 100 sur la courbe de calibration.</p>
