            <p class="Glossary_term">redilution</p>
            <p>La redilution est le fait de réaliser la même mesure avec la même méthodologie, sur le même échantillon (patient, CQ), mais avec un taux de dilution différent de celui qui vient d'amener à un résultat ou une erreur.</p>
