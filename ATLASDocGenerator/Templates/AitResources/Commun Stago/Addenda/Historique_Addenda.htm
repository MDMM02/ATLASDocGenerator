<?xml version="1.0" encoding="utf-8"?>
<html xmlns:madcap="http://www.madcapsoftware.com/Schemas/MadCap.xsd" xmlns:MadCap="http://www.madcapsoftware.com/Schemas/MadCap.xsd" xml:lang="fr-fr" MadCap:conditions="Stago_Gestion.Contenu commun">
    <head>
        <link href="../../TableStyles/Tableau_classique.css" rel="stylesheet" MadCap:stylesheetType="table" />
    </head>
    <body>
        <h1 class="non_numerote">Historique des modifications</h1>
        <table style="width: 100%;margin-left: auto;margin-right: auto;mc-table-style: url('../../TableStyles/Tableau_classique.css');" class="TableStyle-Tableau_classique" cellspacing="0">
            <col class="TableStyle-Tableau_classique-Column-Column1" style="width: 138px;" />
            <col class="TableStyle-Tableau_classique-Column-Column1" style="width: 94px;" />
            <col class="TableStyle-Tableau_classique-Column-Column1" style="width: 103px;" />
            <col class="TableStyle-Tableau_classique-Column-Column1" />
            <thead>
                <tr class="TableStyle-Tableau_classique-Head-Header1">
                    <th class="TableStyle-Tableau_classique-HeadE-Column1-Header1">
                        <p>
                            <MadCap:snippetText src="../Historiques/Date.flsnp" />
                        </p>
                    </th>
                    <th class="TableStyle-Tableau_classique-HeadE-Column1-Header1">
                        <p>
                            <MadCap:snippetText src="../Historiques/Référence_1.flsnp" />
                        </p>
                    </th>
                    <th class="TableStyle-Tableau_classique-HeadE-Column1-Header1">
                        <p>
                            <MadCap:snippetText src="../Historiques/Logiciel_1.flsnp" />
                        </p>
                    </th>
                    <th class="TableStyle-Tableau_classique-HeadD-Column1-Header1">
                        <p>
                            <MadCap:snippetText src="../Historiques/Modifications_1.flsnp" />
                        </p>
                    </th>
                </tr>
            </thead>
            <tbody>
                <tr class="TableStyle-Tableau_classique-Body-Body1">
                    <td class="TableStyle-Tableau_classique-BodyB-Column1-Body1">
                        <p>AAAA-MM_JJ</p>
                        <p MadCap:conditions="Stago_Gestion.Commentaires">mettre la date dans un snippet</p>
                    </td>
                    <td class="TableStyle-Tableau_classique-BodyB-Column1-Body1">
                        <p class="a_centre"><MadCap:variable name="General.DocumentReference" />_1_<MadCap:variable name="General.DocumentLanguage" /></p>
                    </td>
                    <td class="TableStyle-Tableau_classique-BodyB-Column1-Body1">
                        <p class="a_centre">
                            <MadCap:snippetText src="../Divers/Non_applicable.flsnp" />
                        </p>
                        <p MadCap:conditions="Stago_Gestion.Commentaires">ou à partir de X.X ou X.X</p>
                        <p MadCap:conditions="Stago_Gestion.Commentaires">mettre la version de logiciel dans un snippet</p>
                    </td>
                    <td class="TableStyle-Tableau_classique-BodyA-Column1-Body1">
                        <p>
                            <MadCap:snippetText src="../Historiques/Création.flsnp" />
                        </p>
                    </td>
                </tr>
            </tbody>
        </table>
        <div class="a_Information">
            <p>Dans une référence de document, x désigne le dernier indice en vigueur.</p>
        </div>
        <p>Cet addenda complète le manuel de référence <MadCap:variable name="General.dispositif" />.</p>
    </body>
</html>
